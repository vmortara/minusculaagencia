<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Currículo Interativo 8-Bit — Vitor Mortara (Jogo Completo)</title>
  <!-- Fonte retro pixelada estilo NES -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #11131a;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 12px;
    }

    .game-wrapper {
      width: 100%;
      max-width: 920px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .hud-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      background: #000000;
      border: 4px solid #ffffff;
      padding: 10px 14px;
      font-size: 10px;
      line-height: 1.5;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.5);
    }

    .hud-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hud-tag {
      color: #fbd000;
    }

    .hud-meta {
      color: #a8c6fa;
      font-size: 9px;
    }

    .hud-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .canvas-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #5C94FC;
      border: 4px solid #ffffff;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.65);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Controles táteis para dispositivos móveis / clique na tela */
    .touch-controls {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      gap: 10px;
    }

    .dpad-group, .action-group {
      display: flex;
      gap: 10px;
    }

    .nes-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      background: #232734;
      color: #ffffff;
      border: 3px solid #ffffff;
      padding: 12px 14px;
      cursor: pointer;
      box-shadow: 0 4px 0 #000000;
      transition: transform 0.05s, background-color 0.1s;
      touch-action: manipulation;
    }

    .nes-btn:active, .nes-btn.pressed {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #000000;
      background: #3d445c;
    }

    .nes-btn.stage-btn {
      font-size: 9px;
      padding: 7px 9px;
      border-width: 2px;
      box-shadow: 0 3px 0 #000000;
    }

    .nes-btn.stage-btn.active-stage {
      background: #fbd000;
      color: #000000;
      border-color: #ffffff;
    }

    .nes-btn.jump-btn {
      background: #c83232;
    }

    .nes-btn.jump-btn:active, .nes-btn.jump-btn.pressed {
      background: #9e2222;
    }

    .nes-btn.action-continue {
      background: #1b8a2e;
    }

    .nes-btn.replay-btn {
      background: #2e8b57;
      font-size: 9px;
      padding: 7px 10px;
      border-width: 2px;
      box-shadow: 0 3px 0 #000000;
    }

    .instructions {
      font-size: 8px;
      color: #b0b8d1;
      text-align: center;
      line-height: 1.6;
    }

    @media (max-width: 680px) {
      .hud-header {
        font-size: 8px;
        padding: 8px 10px;
      }
      .hud-meta {
        font-size: 8px;
      }
      .nes-btn {
        padding: 12px 11px;
        font-size: 10px;
      }
      .nes-btn.stage-btn, .nes-btn.replay-btn {
        padding: 6px 8px;
        font-size: 8px;
      }
      .instructions {
        display: none;
      }
    }
  </style>
</head>

  <div class="game-wrapper">

    </div>

    <div class="touch-controls">
      <div class="dpad-group">
        <button id="btnLeft" class="nes-btn" aria-label="Andar para a esquerda">◀ ESQ</button>
        <button id="btnRight" class="nes-btn" aria-label="Andar para a direita">DIR ▶</button>
      </div>
      <div class="instructions">
        [← / →] ANDAR • [ESPAÇO / ↑] PULAR • [ESPAÇO / ENTER / OK] AVANÇAR • [R] REINICIAR
      </div>
      <div class="action-group">
        <button id="btnAction" class="nes-btn action-continue" aria-label="Avançar diálogo">OK</button>
        <button id="btnJump" class="nes-btn jump-btn" aria-label="Pular">▲ PULAR</button>

          if (n === stageNum) {
            stageBtns[n].classList.add('active-stage');
          } else {
            stageBtns[n].classList.remove('active-stage');
          }
        });

        const p = state.player;
        p.x = 64;
        p.y = GROUND_Y - p.h;
        p.vx = 0;
        p.vy = 0;
        p.onGround = true;
        p.falling = false;
        p.facing = 1;
        p.walkFrame = 0;
        p.walkTimer = 0;
        p.lookingUp = false;

        if (stageNum === 1) {
          state.activeDialogueKey = null;
          state.triggered = {
            s1_fflch: false,
            s1_typewriter: false
          };
        } else if (stageNum === 2) {
          state.activeDialogueKey = 's2_intro';
          state.triggered = {
            s2_intro: true,
            s2_coffee: false,
            s2_bike: false,
            s2_market: false
          };
        } else if (stageNum === 3) {
          state.activeDialogueKey = 's3_intro';
          state.triggered = {
            s3_intro: true,
            s3_restaurant: false,
            s3_pasta: false,
            s3_kitchen: false,
            s3_computer: false
          };
        }
      }

      function handleDialogueAdvance() {
        if (state.activeDialogueKey) {
          const currentText = DIALOGUES[state.activeDialogueKey].text;
          if (state.typedChars < currentText.length) {
            state.typedChars = currentText.length;
          } else {
            state.activeDialogueKey = null;
            state.player.lookingUp = false;
          }
          return;
        }

        if (state.stageCompleted) {
          if (state.currentStage === 1) {
            loadStage(2);
          } else if (state.currentStage === 2) {
            loadStage(3);
          } else {
            loadStage(1);
          }
        }
      }

      window.addEventListener('keydown', (e) => {
        const code = e.code;
        if (code === 'ArrowLeft' || code === 'KeyA') state.keys.left = true;
        if (code === 'ArrowRight' || code === 'KeyD') state.keys.right = true;

        if (code === 'Space' || code === 'ArrowUp' || code === 'KeyW') {
          e.preventDefault();
          if (state.activeDialogueKey || state.stageCompleted) {
            handleDialogueAdvance();
          } else {
            state.keys.jump = true;
          }
        }

        if (code === 'Enter') {
          e.preventDefault();
          if (state.activeDialogueKey || state.stageCompleted) {
            handleDialogueAdvance();
          }
        }

        if (code === 'KeyR') loadStage(state.currentStage);
        if (code === 'Digit1') loadStage(1);
        if (code === 'Digit2') loadStage(2);
        if (code === 'Digit3') loadStage(3);
      });

      window.addEventListener('keyup', (e) => {
        const code = e.code;
        if (code === 'ArrowLeft' || code === 'KeyA') state.keys.left = false;
        if (code === 'ArrowRight' || code === 'KeyD') state.keys.right = false;
        if (code === 'Space' || code === 'ArrowUp' || code === 'KeyW') state.keys.jump = false;
      });

      function bindHoldButton(btnId, keyName) {
        const btn = document.getElementById(btnId);
        if (!btn) return;
        const press = (e) => {
          e.preventDefault();
          if ((state.activeDialogueKey || state.stageCompleted) && keyName === 'jump') {
            handleDialogueAdvance();
            return;
          }
          state.keys[keyName] = true;
          btn.classList.add('pressed');
        };
        const release = (e) => {
          e.preventDefault();
          state.keys[keyName] = false;
          btn.classList.remove('pressed');
        };
        btn.addEventListener('mousedown', press);
        btn.addEventListener('mouseup', release);
        btn.addEventListener('mouseleave', release);
        btn.addEventListener('touchstart', press, { passive: false });
        btn.addEventListener('touchend', release, { passive: false });
        btn.addEventListener('touchcancel', release, { passive: false });
      }

      bindHoldButton('btnLeft', 'left');
      bindHoldButton('btnRight', 'right');
      bindHoldButton('btnJump', 'jump');

      document.getElementById('btnAction').addEventListener('click', (e) => {
        e.preventDefault();
        handleDialogueAdvance();
      });

      document.getElementById('btnReplayTop').addEventListener('click', () => loadStage(state.currentStage));
      stageBtns[1].addEventListener('click', () => loadStage(1));
      stageBtns[2].addEventListener('click', () => loadStage(2));
      stageBtns[3].addEventListener('click', () => loadStage(3));

      canvas.addEventListener('click', () => {
        if (state.activeDialogueKey || state.stageCompleted) {
          handleDialogueAdvance();
        }
      });

      function update() {
        state.frame++;
        const p = state.player;
        const stage = state.currentStage;
        const levelW = STAGES_META[stage].width;

        if (!state.activeDialogueKey && !state.stageCompleted) {
          if (p.falling) {
            p.vx = 0;
          } else if (state.keys.left && !state.keys.right) {
            p.vx = -p.speed;
            p.facing = -1;
          } else if (state.keys.right && !state.keys.left) {
            p.vx = p.speed;
            p.facing = 1;
          } else {
            p.vx = 0;
          }

          if (state.keys.jump && p.onGround && !p.falling) {
            p.vy = p.jumpForce;
            p.onGround = false;
          }

          p.vy += p.gravity;
          p.x += p.vx;
          p.y += p.vy;

          if (p.x < 16) p.x = 16;
          if (p.x > levelW - p.w - 24) p.x = levelW - p.w - 24;

          const centerX = p.x + p.w / 2;
          const overHole = stage === 1 && centerX > S1.HOLE_X && centerX < S1.HOLE_X + S1.HOLE_W;

          if (p.y + p.h >= GROUND_Y) {
            if (overHole || p.falling) {
              p.falling = true;
              p.onGround = false;
            } else {
              p.y = GROUND_Y - p.h;
              p.vy = 0;
              p.onGround = true;
            }
          } else if (overHole && p.onGround) {
            p.onGround = false;
          }

          if (stage === 1 && p.falling && p.y > VIEW_H + 30) {
            p.falling = false;
            p.x = S1.LANDING_X;
            p.y = -90;
            p.vy = 0;
            p.vx = 0;
            p.facing = 1;
            p.lookingUp = false;
          }

          if (!p.onGround) {
            p.walkFrame = 1;
          } else if (Math.abs(p.vx) > 0.1) {
            p.walkTimer += 0.9;
            if (p.walkTimer >= 6) {
              p.walkTimer = 0;
              p.walkFrame = (p.walkFrame + 1) % 4;
            }
          } else {
            p.walkFrame = 0;
            p.walkTimer = 0;
          }

          if (stage === 1) {
            if (!state.triggered.s1_fflch && p.x >= S1.TRIGGER_FFLCH_X && p.onGround) {
              p.x = S1.TRIGGER_FFLCH_X;
              p.vx = 0;
              p.walkFrame = 0;
              p.facing = 1;
              p.lookingUp = true;
              state.triggered.s1_fflch = true;
              openDialogue('s1_fflch');
            }
            if (!state.triggered.s1_typewriter && p.x >= S1.TRIGGER_DESK_X && p.onGround) {
              p.x = S1.TRIGGER_DESK_X;
              p.vx = 0;
              p.walkFrame = 0;
              p.facing = 1;
              p.lookingUp = false;
              state.triggered.s1_typewriter = true;
              openDialogue('s1_typewriter');
            }
            if (state.triggered.s1_typewriter && !state.stageCompleted && p.x >= S1.FINISH_FLAG_X && p.onGround) {
              p.x = S1.FINISH_FLAG_X;
              p.vx = 0;
              p.walkFrame = 0;
              state.stageCompleted = true;
            }
          } else if (stage === 2) {
            if (!state.triggered.s2_coffee && p.x >= S2.TRIGGER_COFFEE_X && p.onGround) {
              p.x = S2.TRIGGER_COFFEE_X;
              p.vx = 0;
              p.walkFrame = 0;
              p.facing = 1;
              state.triggered.s2_coffee = true;
              openDialogue('s2_coffee');
            }
            if (!state.triggered.s2_bike && p.x >= S2.TRIGGER_BIKE_X && p.onGround) {
              p.x = S2.TRIGGER_BIKE_X;
              p.vx = 0;
              p.walkFrame = 0;
              p.facing = 1;
              state.triggered.s2_bike = true;
              openDialogue('s2_bike');
            }
            if (!state.triggered.s2_market && p.x >= S2.TRIGGER_MARKET_X && p.onGround) {
              p.x = S2.TRIGGER_MARKET_X;
              p.vx = 0;
              p.walkFrame = 0;
              p.facing = 1;
              state.triggered.s2_market = true;
              openDialogue('s2_market');
            }
            if (state.triggered.s2_market && !state.stageCompleted && p.x >= S2.TRIGGER_AIRPORT_X && p.onGround) {
              p.x = S2.TRIGGER_AIRPORT_X;
              p.vx = 0;
              p.walkFrame = 0;
              state.stageCompleted = true;
            }
          } else if (stage === 3) {
            if (!state.triggered.s3_restaurant && p.x >= S3.TRIGGER_RESTAURANT_X && p.onGround) {
              p.x = S3.TRIGGER_RESTAURANT_X;
              p.vx = 0;
              p.walkFrame = 0;
              p.facing = 1;
              state.triggered.s3_restaurant = true;
              openDialogue('s3_restaurant');
            }
            if (!state.triggered.s3_pasta && p.x >= S3.TRIGGER_PASTA_X && p.onGround) {
              p.x = S3.TRIGGER_PASTA_X;
              p.vx = 0;
              p.walkFrame = 0;
              p.facing = 1;
              state.triggered.s3_pasta = true;
              openDialogue('s3_pasta');
            }
            if (!state.triggered.s3_kitchen && p.x >= S3.TRIGGER_KITCHEN_X && p.onGround) {
              p.x = S3.TRIGGER_KITCHEN_X;
              p.vx = 0;
              p.walkFrame = 0;
              p.facing = 1;
              state.triggered.s3_kitchen = true;
              openDialogue('s3_kitchen');
            }
            if (!state.triggered.s3_computer && p.x >= S3.TRIGGER_COMPUTER_X && p.onGround) {
              p.x = S3.TRIGGER_COMPUTER_X;
              p.vx = 0;
              p.walkFrame = 0;
              p.facing = 1;
              state.triggered.s3_computer = true;
              openDialogue('s3_computer');
            }
            if (state.triggered.s3_computer && !state.stageCompleted && p.x >= S3.FINISH_FLAG_X && p.onGround) {
              p.x = S3.FINISH_FLAG_X;
              p.vx = 0;
              p.walkFrame = 0;
              state.stageCompleted = true;
            }
          }
        } else if (state.activeDialogueKey) {
          const fullText = DIALOGUES[state.activeDialogueKey].text;
          if (state.typedChars < fullText.length) {
            state.typeTimer++;
            if (state.typeTimer >= 1) {
              state.typeTimer = 0;
              state.typedChars += 3;
              if (state.typedChars > fullText.length) {
                state.typedChars = fullText.length;
              }
            }
          }
        }

        const targetCamX = p.x - VIEW_W * 0.30;
        state.cameraX += (targetCamX - state.cameraX) * 0.14;
        if (state.cameraX < 0) state.cameraX = 0;
        if (state.cameraX > levelW - VIEW_W) state.cameraX = levelW - VIEW_W;
      }

      function openDialogue(key) {
        state.activeDialogueKey = key;
        state.typedChars = 0;
        state.typeTimer = 0;
      }

      function drawCloud(x, y, scale) {
        const s = Math.round(4 * scale);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x + s * 2, y, s * 6, s * 2);
        ctx.fillRect(x + s, y + s, s * 8, s * 2);
        ctx.fillRect(x, y + s * 2, s * 10, s * 2);
        ctx.fillStyle = '#cbe0ff';
        ctx.fillRect(x + s, y + s * 3, s * 8, s);
      }

      function drawSPBuildings(buildingsList, camX, offsetX) {
        buildingsList.forEach((b) => {
          const screenX = Math.round(b.x - camX * 0.65 + offsetX);
          if (screenX + b.w < -40 || screenX > VIEW_W + 40) return;

          const topY = GROUND_Y - b.h;
          ctx.fillStyle = b.color;
          ctx.fillRect(screenX, topY, b.w, b.h);

          ctx.fillStyle = '#3b4761';
          ctx.fillRect(screenX + b.w - 6, topY, 6, b.h);
          ctx.fillRect(screenX - 2, topY - 4, b.w + 4, 4);

          ctx.fillStyle = b.winColor;
          const padX = 10;
          const padY = 12;
          const gapX = Math.floor((b.w - padX * 2) / b.cols);
          const gapY = Math.floor((b.h - padY * 2) / b.rows);

          for (let r = 0; r < b.rows; r++) {
            for (let c = 0; c < b.cols; c++) {
              ctx.fillRect(screenX + padX + c * gapX, topY + padY + r * gapY, 6, 8);
            }
          }
        });
      }

      function drawLisbonBuildings(camX) {
        lisbonBuildings.forEach((b) => {
          const screenX = Math.round(b.x - camX * 0.65);
          if (screenX + b.w < -40 || screenX > VIEW_W + 40) return;

          const topY = GROUND_Y - b.h;

          ctx.fillStyle = b.roof;
          ctx.fillRect(screenX - 2, topY - 8, b.w + 4, 8);
          ctx.fillRect(screenX + 2, topY - 12, b.w - 4, 4);
          ctx.fillStyle = '#75250e';
          for (let tx = screenX; tx < screenX + b.w - 2; tx += 6) {
            ctx.fillRect(tx, topY - 6, 2, 5);
          }

          ctx.fillStyle = '#efeae1';
          ctx.fillRect(screenX + 10, topY - 20, 8, 8);
          ctx.fillStyle = b.roof;
          ctx.fillRect(screenX + 8, topY - 22, 12, 2);

          ctx.fillStyle = b.wall;
          ctx.fillRect(screenX, topY, b.w, b.h);

          ctx.fillStyle = b.trim;
          ctx.fillRect(screenX + b.w - 5, topY, 5, b.h);
          ctx.fillRect(screenX - 2, topY, b.w + 4, 3);

          if (b.azulejo) {
            ctx.fillStyle = '#d9ecff';
            for (let ay = topY + 6; ay < GROUND_Y - 6; ay += 8) {
              for (let ax = screenX + 4; ax < screenX + b.w - 8; ax += 8) {
                ctx.fillRect(ax, ay, 2, 2);
              }
            }
          }

          const padX = 11;
          const padY = 12;
          const gapX = Math.floor((b.w - padX * 2) / b.cols);
          const gapY = Math.floor((b.h - padY - 14) / b.floors);

          for (let r = 0; r < b.floors; r++) {
            for (let c = 0; c < b.cols; c++) {
              const wx = screenX + padX + c * gapX;
              const wy = topY + padY + r * gapY;

              ctx.fillStyle = '#ffffff';
              ctx.fillRect(wx - 1, wy - 1, 10, 15);
              ctx.fillStyle = '#3b5978';
              ctx.fillRect(wx, wy, 8, 13);
              ctx.fillStyle = '#7ea6cc';
              ctx.fillRect(wx + 1, wy + 1, 2, 11);

              if (b.balcony) {
                ctx.fillStyle = '#252a34';
                ctx.fillRect(wx - 3, wy + 10, 14, 1);
                ctx.fillRect(wx - 3, wy + 14, 14, 2);
                for (let bx = wx - 2; bx <= wx + 9; bx += 3) {
                  ctx.fillRect(bx, wy + 10, 1, 4);
                }
              }
            }
          }

          const doorX = screenX + Math.floor(b.w / 2) - 5;
          ctx.fillStyle = '#5c3419';
          ctx.fillRect(doorX, GROUND_Y - 16, 10, 16);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(doorX - 1, GROUND_Y - 17, 12, 1);
        });
      }

      function drawGround(camX) {
        const stage = state.currentStage;
        const tileSize = 16;
        const startCol = Math.floor(camX / tileSize);
        const endCol = startCol + Math.ceil(VIEW_W / tileSize) + 2;

        for (let col = startCol; col <= endCol; col++) {
          const worldX = col * tileSize;
          const screenX = Math.round(worldX - camX);
          const groundH = VIEW_H - GROUND_Y;

          if (stage === 1 && worldX < S1.TRANSITION_X) {
            ctx.fillStyle = '#c84c0c';
            ctx.fillRect(screenX, GROUND_Y + 6, tileSize, groundH - 6);
            ctx.fillStyle = '#802800';
            ctx.fillRect(screenX + 2, GROUND_Y + 12, 4, 4);
            ctx.fillRect(screenX + 10, GROUND_Y + 24, 4, 4);
            ctx.fillRect(screenX + 4, GROUND_Y + 34, 6, 4);

            ctx.fillStyle = '#00a800';
            ctx.fillRect(screenX, GROUND_Y, tileSize, 6);
            ctx.fillStyle = '#80d010';
            ctx.fillRect(screenX, GROUND_Y, tileSize, 2);
            ctx.fillStyle = '#005800';
            ctx.fillRect(screenX + (col % 2) * 4, GROUND_Y + 6, 8, 2);
          } else if (stage === 3) {
            ctx.fillStyle = '#9aa1ad';
            ctx.fillRect(screenX, GROUND_Y + 6, tileSize, groundH - 6);
            ctx.fillStyle = '#d6dce6';
            ctx.fillRect(screenX, GROUND_Y, tileSize, 6);
            ctx.fillStyle = '#eef2f7';
            ctx.fillRect(screenX, GROUND_Y, tileSize, 2);
            ctx.fillStyle = '#68707d';
            if (col % 2 === 0) ctx.fillRect(screenX, GROUND_Y, 2, groundH);
            ctx.fillRect(screenX + 4, GROUND_Y + 3, 2, 2);
            ctx.fillRect(screenX + 11, GROUND_Y + 3, 2, 2);
            ctx.fillRect(screenX + 3, GROUND_Y + 13, 4, 3);
            ctx.fillRect(screenX + 10, GROUND_Y + 19, 4, 3);
            ctx.fillRect(screenX + 5, GROUND_Y + 29, 5, 3);
          } else {
            ctx.fillStyle = '#8c929e';
            ctx.fillRect(screenX, GROUND_Y + 6, tileSize, groundH - 6);
            ctx.fillStyle = '#bcc2ce';
            ctx.fillRect(screenX, GROUND_Y, tileSize, 6);
            ctx.fillStyle = '#dfe4ee';
            ctx.fillRect(screenX, GROUND_Y, tileSize, 2);
            ctx.fillStyle = '#5a606b';
            if (col % 2 === 0) ctx.fillRect(screenX, GROUND_Y, 2, groundH);
            ctx.fillRect(screenX + 6, GROUND_Y + 16, 3, 2);
            ctx.fillRect(screenX + 11, GROUND_Y + 30, 3, 2);
          }
        }

        if (stage === 1) {
          const holeScreenX = Math.round(S1.HOLE_X - camX);
          if (holeScreenX + S1.HOLE_W > 0 && holeScreenX < VIEW_W) {
            ctx.fillStyle = '#07080d';
            ctx.fillRect(holeScreenX, GROUND_Y, S1.HOLE_W, VIEW_H - GROUND_Y);
            ctx.fillStyle = '#3a3f4a';
            ctx.fillRect(holeScreenX, GROUND_Y, 4, VIEW_H - GROUND_Y);
            ctx.fillRect(holeScreenX + S1.HOLE_W - 4, GROUND_Y, 4, VIEW_H - GROUND_Y);
          }

          const transScreenX = Math.round(S1.TRANSITION_X - camX);
          if (transScreenX >= -20 && transScreenX <= VIEW_W + 20) {
            ctx.fillStyle = '#4e545e';
            ctx.fillRect(transScreenX - 2, GROUND_Y - 2, 4, VIEW_H - GROUND_Y + 2);
          }
        }
      }

      function drawS1Foliage(item, screenX) {
        if (item.type === 'tree') {
          ctx.fillStyle = '#7c4722';
          ctx.fillRect(screenX + 18, GROUND_Y - 36, 12, 36);
          ctx.fillStyle = '#573014';
          ctx.fillRect(screenX + 26, GROUND_Y - 36, 4, 36);

          ctx.fillStyle = '#1b8a2e';
          ctx.fillRect(screenX + 4, GROUND_Y - 68, 40, 34);
          ctx.fillRect(screenX + 10, GROUND_Y - 78, 28, 12);
          ctx.fillStyle = '#43c43b';
          ctx.fillRect(screenX + 8, GROUND_Y - 66, 28, 18);
          ctx.fillRect(screenX + 14, GROUND_Y - 74, 16, 10);
        } else {
          ctx.fillStyle = '#1b8a2e';
          ctx.fillRect(screenX, GROUND_Y - 16, 44, 16);
          ctx.fillRect(screenX + 6, GROUND_Y - 24, 32, 10);
          ctx.fillStyle = '#43c43b';
          ctx.fillRect(screenX + 4, GROUND_Y - 14, 32, 8);
          ctx.fillRect(screenX + 10, GROUND_Y - 20, 20, 6);
        }
      }

      function drawS1FFLCH(camX) {
        const bx = Math.round(S1.FFLCH_X - camX);
        if (bx > VIEW_W + 50 || bx + S1.FFLCH_W < -50) return;

        const bw = S1.FFLCH_W;
        const bh = 162;
        const by = GROUND_Y - bh;

        ctx.fillStyle = '#d9cfc1';
        ctx.fillRect(bx, by, bw, bh);
        ctx.fillStyle = '#b5a898';
        ctx.fillRect(bx + bw - 14, by, 14, bh);
        ctx.fillStyle = '#6e6a66';
        ctx.fillRect(bx - 4, GROUND_Y - 14, bw + 8, 14);
        ctx.fillStyle = '#8c3b2b';
        ctx.fillRect(bx - 6, by - 10, bw + 12, 10);
        ctx.fillStyle = '#5e2318';
        ctx.fillRect(bx - 6, by - 2, bw + 12, 2);

        const signW = 108;
        const signH = 24;
        const signX = bx + Math.floor((bw - signW) / 2);
        const signY = by + 10;

        ctx.fillStyle = '#24344d';
        ctx.fillRect(signX, signY, signW, signH);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.strokeRect(signX + 1, signY + 1, signW - 2, signH - 2);

        ctx.fillStyle = '#fbd000';
        ctx.font = '13px "Press Start 2P", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('FFLCH', signX + signW / 2 + 1, signY + signH / 2 + 1);

        ctx.fillStyle = '#ffffff';
        ctx.font = '6px "Press Start 2P", monospace';
        ctx.fillText('LETRAS • USP', signX + signW / 2, signY + signH + 8);

        const winCols = [bx + 18, bx + 46, bx + 164, bx + 192];
        const winRows = [by + 46, by + 82, by + 116];

        winRows.forEach((wy) => {
          winCols.forEach((wx) => {
            ctx.fillStyle = '#5c5349';
            ctx.fillRect(wx - 2, wy - 2, 22, 24);
            ctx.fillStyle = '#3b6ea5';
            ctx.fillRect(wx, wy, 18, 20);
            ctx.fillStyle = '#7fb2eb';
            ctx.fillRect(wx + 2, wy + 2, 5, 14);
            ctx.fillStyle = '#d9cfc1';
            ctx.fillRect(wx + 8, wy, 2, 20);
            ctx.fillRect(wx, wy + 9, 18, 2);
          });
        });

        const doorW = 52;
        const doorH = 54;
        const doorX = bx + Math.floor((bw - doorW) / 2);
        const doorY = GROUND_Y - doorH - 6;

        ctx.fillStyle = '#ebe3d8';
        ctx.fillRect(doorX - 10, doorY - 8, 10, doorH + 8);
        ctx.fillRect(doorX + doorW, doorY - 8, 10, doorH + 8);
        ctx.fillRect(doorX - 12, doorY - 12, doorW + 24, 8);

        ctx.fillStyle = '#4a2c18';
        ctx.fillRect(doorX, doorY, doorW, doorH);
        ctx.fillStyle = '#2b180c';
        ctx.fillRect(doorX + doorW / 2 - 1, doorY, 2, doorH);
        ctx.fillStyle = '#5d92c9';
        ctx.fillRect(doorX + 5, doorY + 6, 16, 20);

        const rackX = px + 68;
        ctx.fillStyle = '#9e5e2e';
        ctx.fillRect(rackX + 10, tableTopY - 22, 2, 22);
        ctx.fillRect(rackX + 2, tableTopY - 22, 18, 2);
        ctx.fillStyle = '#f7d560';
        for (let sx = rackX + 4; sx <= rackX + 16; sx += 3) {
          ctx.fillRect(sx, tableTopY - 20, 2, 16);
        }

        ctx.fillStyle = '#b8763e';
        ctx.fillRect(px + 8, tableTopY - 3, 12, 3);
      }

      function drawS3StainlessKitchen(camX) {
        const kx = Math.round(S3.KITCHEN_X - camX);
        if (kx > VIEW_W + 60 || kx + 180 < -60) return;

        const wallW = 164;
        const wallH = 92;
        const wallY = GROUND_Y - wallH;

        ctx.fillStyle = '#e8edf2';
        ctx.fillRect(kx, wallY, wallW, wallH);
        ctx.strokeStyle = '#c5ced9';
        ctx.lineWidth = 1;
        ctx.strokeRect(kx + 0.5, wallY + 0.5, wallW - 1, wallH - 1);

        ctx.fillStyle = '#cfd7e3';
        for (let ty = wallY + 12; ty < GROUND_Y - 28; ty += 12) {
          ctx.fillRect(kx + 1, ty, wallW - 2, 1);
        }

        ctx.fillStyle = '#9aa4b5';
        ctx.fillRect(kx + 10, wallY + 18, 56, 3);
        ctx.fillStyle = '#cfd6e0';
        ctx.fillRect(kx + 14, wallY + 9, 14, 9);
        ctx.fillRect(kx + 32, wallY + 11, 12, 7);
        ctx.fillStyle = '#5a606b';
        ctx.fillRect(kx + 28, wallY + 12, 4, 2);
        ctx.fillRect(kx + 44, wallY + 13, 4, 2);

        const hoodX = kx + 84;
        ctx.fillStyle = '#aeb6c4';
        ctx.fillRect(hoodX + 18, wallY, 28, 12);
        ctx.fillStyle = '#cfd6e0';
        ctx.fillRect(hoodX, wallY + 12, 64, 14);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(hoodX + 2, wallY + 14, 60, 3);
        ctx.fillStyle = '#6f7785';
        ctx.fillRect(hoodX, wallY + 25, 64, 2);

        const prepX = kx + 8;
        const counterTopY = GROUND_Y - 28;
        ctx.fillStyle = '#9aa4b5';
        ctx.fillRect(prepX, counterTopY, 68, 28);
        ctx.fillStyle = '#dfe5ee';
        ctx.fillRect(prepX - 1, counterTopY, 70, 4);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(prepX - 1, counterTopY, 70, 1);
        ctx.fillStyle = '#7e8796';
        ctx.fillRect(prepX + 4, counterTopY + 7, 28, 17);
        ctx.fillRect(prepX + 36, counterTopY + 7, 28, 17);
        ctx.fillStyle = '#dfe5ee';
        ctx.fillRect(prepX + 28, counterTopY + 11, 2, 8);
        ctx.fillRect(prepX + 40, counterTopY + 11, 2, 8);

        ctx.fillStyle = '#f5f7fa';
        ctx.fillRect(prepX + 12, counterTopY - 2, 22, 2);
        ctx.fillStyle = '#38b000';
        ctx.fillRect(prepX + 16, counterTopY - 5, 6, 3);
        ctx.fillStyle = '#d62828';
        ctx.fillRect(prepX + 24, counterTopY - 5, 5, 3);

        const stoveX = kx + 84;
        ctx.fillStyle = '#8b94a3';
        ctx.fillRect(stoveX, counterTopY, 64, 28);
        ctx.fillStyle = '#dfe5ee';
        ctx.fillRect(stoveX - 1, counterTopY, 66, 4);
        ctx.fillStyle = '#1f232b';
        for (let bx = stoveX + 6; bx < stoveX + 58; bx += 10) {
          ctx.fillRect(bx, counterTopY + 6, 4, 3);
        }
        ctx.fillStyle = '#2b303a';
        ctx.fillRect(stoveX + 8, counterTopY + 12, 48, 12);
        ctx.fillStyle = '#ff9f1c';
        ctx.fillRect(stoveX + 12, counterTopY + 14, 40, 7);

        const flameFlicker = Math.floor(state.frame / 8) % 2;
        ctx.fillStyle = '#38b6ff';
        ctx.fillRect(stoveX + 10 + flameFlicker, counterTopY - 2, 12, 2);
        ctx.fillRect(stoveX + 40 - flameFlicker, counterTopY - 2, 14, 2);

        ctx.fillStyle = '#5a606b';
        ctx.fillRect(stoveX + 8, counterTopY - 10, 16, 8);
        ctx.fillRect(stoveX + 38, counterTopY - 7, 18, 5);
        ctx.fillStyle = '#1f232b';
        ctx.fillRect(stoveX + 56, counterTopY - 6, 7, 2);

        const steamShift = Math.floor(state.frame / 12) % 4;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.fillRect(stoveX + 14, counterTopY - 14 - steamShift, 2, 2);
        ctx.fillRect(stoveX + 45, counterTopY - 11 - steamShift, 2, 2);
      }

      function drawS3ComputerDesk(camX) {
        const dx = Math.round(S3.COMPUTER_X - camX);
        if (dx > VIEW_W + 60 || dx + 100 < -60) return;

        ctx.fillStyle = '#232730';
        ctx.fillRect(dx + 1, GROUND_Y - 32, 3, 18);
        ctx.fillRect(dx, GROUND_Y - 15, 15, 3);
        ctx.fillRect(dx + 6, GROUND_Y - 12, 3, 9);
        ctx.fillRect(dx + 2, GROUND_Y - 3, 11, 3);

        const tableX = dx + 18;
        const tableW = 58;
        const tableTopY = GROUND_Y - 24;

        ctx.fillStyle = '#3b404a';
        ctx.fillRect(tableX + 4, tableTopY + 4, 4, 20);
        ctx.fillRect(tableX + tableW - 8, tableTopY + 4, 4, 20);
        ctx.fillStyle = '#c4864b';
        ctx.fillRect(tableX, tableTopY, tableW, 4);
        ctx.fillStyle = '#e0a267';
        ctx.fillRect(tableX, tableTopY, tableW, 1);

        const monX = tableX + 16;
        const monY = tableTopY - 22;

        ctx.fillStyle = '#2b303a';
        ctx.fillRect(monX + 9, tableTopY - 2, 12, 2);
        ctx.fillRect(monX + 13, tableTopY - 6, 4, 4);

        ctx.fillStyle = '#1b1e24';
        ctx.fillRect(monX, monY, 30, 17);
        ctx.fillStyle = '#0f294a';
        ctx.fillRect(monX + 2, monY + 2, 26, 13);

        ctx.fillStyle = '#43c43b';
        ctx.fillRect(monX + 4, monY + 4, 12, 2);
        ctx.fillStyle = '#fbd000';
        ctx.fillRect(monX + 4, monY + 7, 18, 2);
        ctx.fillStyle = '#5cd6ff';
        ctx.fillRect(monX + 4, monY + 10, 14, 2);

        if (Math.floor(state.frame / 18) % 2 === 0) {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(monX + 20, monY + 10, 3, 2);
        }

        ctx.fillStyle = '#cfd6e0';
        ctx.fillRect(tableX + 12, tableTopY - 2, 18, 2);
        ctx.fillRect(tableX + 34, tableTopY - 2, 4, 2);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(tableX + 47, tableTopY - 5, 5, 5);
        ctx.fillStyle = '#c83232';
        ctx.fillRect(tableX + 48, tableTopY - 4, 3, 2);
      }

      function drawFinishFlag(flagX, camX, stageNum) {
        const fx = Math.round(flagX - camX);
        if (fx > VIEW_W + 40 || fx < -40) return;

        ctx.fillStyle = '#5a606b';
        ctx.fillRect(fx - 6, GROUND_Y - 8, 16, 8);
        ctx.fillStyle = '#dfe4ee';
        ctx.fillRect(fx + 1, GROUND_Y - 96, 3, 88);
        ctx.fillStyle = '#fbd000';
        ctx.fillRect(fx - 1, GROUND_Y - 101, 7, 5);

        const wave = Math.sin(state.frame * 0.12) * 1.5;
        if (stageNum === 1) {
          ctx.fillStyle = '#1ca62c';
          ctx.fillRect(fx + 4, GROUND_Y - 94, 34, 20);
          ctx.fillRect(fx + 38, GROUND_Y - 94 + wave, 8, 18);
          ctx.fillStyle = '#fbd000';
          ctx.font = '6px "Press Start 2P", monospace';
          ctx.textAlign = 'left';
          ctx.fillText('FIM 1', fx + 7, GROUND_Y - 82);
        } else {
          ctx.fillStyle = '#1b8a2e';
          ctx.fillRect(fx + 4, GROUND_Y - 94, 16, 20);
          ctx.fillStyle = '#c83232';
          ctx.fillRect(fx + 20, GROUND_Y - 94, 24, 20);
          ctx.fillRect(fx + 44, GROUND_Y - 94 + wave, 8, 18);
          ctx.fillStyle = '#fbd000';
          ctx.fillRect(fx + 18, GROUND_Y - 86, 5, 5);
        }
      }

      function drawPlayer(camX) {
        const p = state.player;
        const stage = state.currentStage;
        const sx = Math.round(p.x - camX);
        const bob = (p.onGround && Math.abs(p.vx) > 0.1 && (p.walkFrame === 0 || p.walkFrame === 2)) ? -1 : 0;
        const sy = Math.round(p.y) + bob;
        const scale = 1.5;

        let headRows;
        if (stage === 1 && p.lookingUp) {
          headRows = [
            ".....bbbbb......",
            "....BBBBBBB.....",
            "...BBBBBBBBB....",
            "...HHHSSSSES....",
            "..HHSSSSSSSS....",
            "..HHSSSSSSSS....",
            "...SSSSSSSS....."
          ];
        } else if (stage === 1) {
          headRows = [
            "....BBBBBB......",
            "...BBBBBBBB.....",
            "...BBBBbbbbb....",
            "...HHHSSSSS.....",
            "..HHSSSSSSSS....",
            "..HHSSSSESSS....",
            "...SSSSSSSS....."
          ];
        } else if (stage === 2) {
          headRows = [
            "....BBBBBB......",
            "...BBBBBBBB.....",
            "...BBBBbbbbb....",
            "...HHHSSSSS.....",
            "..HHSSSSSSSS....",
            "..HHSSSSESSS....",
            "...SSSSSMMM....."
          ];
        } else {
          headRows = [
            "....HHHHHH......",
            "...HHHHHHHH.....",
            "...HHhhHHHHH....",
            "...HHHSSSSS.....",
            "..HHSSSSSSSS....",
            "..HHSSSSESSS....",
            "...SSSSSMMM....."
          ];
        }

        const torsoRows = [
          "....SSSSSS......",
          "...GGGGGGGG.....",
          "..GGGGGGGGGG....",
          "..GGgGGGGgGG....",
          "..SSgGGGGgSS....",
          "..SSGGGGGGSS....",
          "...GGGGGGGG....."
        ];

        const legsNeutral = [
          "....JJJJJJ......",
          "....JJj.jJJ.....",
          "....JJ...JJ.....",
          "....JJ...JJ.....",
          "....JJ...JJ.....",
          "....JJ...JJ.....",
          "...KKK...KKK....",
          "..KKKK...KKKK...",
          "..kkkk...kkkk...",
          "................"
        ];
        const legsStepA = [
          "....JJJJJJ......",
          "...JJJ..JJJ.....",
          "...JJ....JJ.....",
          "..JJ.....JJ.....",
          "..JJ.....JJ.....",
          "..JJ.....JJ.....",
          "..KKK....KKK....",
          ".KKKK....KKKK...",
          ".kkkk....kkkk...",
          "................"
        ];
        const legsStepB = [
          "....JJJJJJ......",
          "....JJJ..JJJ....",
          "....JJ....JJ....",
          "....JJ.....JJ...",
          "....JJ.....JJ...",
          "....JJ.....JJ...",
          "...KKK.....KKK..",
          "...KKKK....KKKK.",
          "...kkkk....kkkk.",
          "................"
        ];

        let activeLegs = legsNeutral;
        if (!p.lookingUp) {
          if (p.walkFrame === 1) activeLegs = legsStepA;
          else if (p.walkFrame === 3) activeLegs = legsStepB;
        }

        const activeSprite = headRows.concat(torsoRows, activeLegs);

        const palette = {
          B: '#1848b8',
          b: '#4888ff',
          H: '#4a2810',
          h: '#6e3f1d',
          M: '#4a2810',
          S: '#f8b888',
          E: '#101010',
          G: '#1ca62c',
          g: '#116b1b',
          J: '#205098',
          j: '#3670c4',
          K: '#141418',
          k: '#4a4a54'
        };

        for (let row = 0; row < activeSprite.length; row++) {
          const line = activeSprite[row];
          for (let col = 0; col < line.length; col++) {
            const ch = line[col];
            if (ch === '.') continue;
            ctx.fillStyle = palette[ch];
            const drawCol = p.facing === 1 ? col : 15 - col;
            ctx.fillRect(
              Math.round(sx + drawCol * scale),
              Math.round(sy + row * scale),
              Math.ceil(scale),
              Math.ceil(scale)
            );
          }
        }
      }

      function drawDialogueBox() {
        if (!state.activeDialogueKey) return;

        const data = DIALOGUES[state.activeDialogueKey];
        const hasTitle = Boolean(data.title && data.title.trim().length > 0);
        const visibleText = data.text.slice(0, state.typedChars);

        const boxX = 18;
        const boxY = 10;
        const boxW = VIEW_W - 36;

        ctx.font = '7px "Press Start 2P", monospace';
        const maxTextWidth = boxW - 26;
        const words = data.text.split(' ');
        const fullLines = [];
        let tempLine = '';

        for (let i = 0; i < words.length; i++) {
          const testLine = tempLine + words[i] + ' ';
          if (ctx.measureText(testLine).width > maxTextWidth && i > 0) {
            fullLines.push(tempLine.trim());
            tempLine = words[i] + ' ';
          } else {
            tempLine = testLine;
          }
        }
        fullLines.push(tempLine.trim());

        const lineHeight = 11;
        const headerOffset = hasTitle ? 26 : 13;
        const boxH = Math.max(74, headerOffset + 20 + fullLines.length * lineHeight);

        ctx.fillStyle = 'rgba(0, 0, 0, 0.62)';
        ctx.fillRect(boxX + 4, boxY + 4, boxW, boxH);

        ctx.fillStyle = '#0c1c44';
        ctx.fillRect(boxX, boxY, boxW, boxH);

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.strokeRect(boxX + 2, boxY + 2, boxW - 4, boxH - 4);
        ctx.strokeRect(boxX + 5, boxY + 5, boxW - 10, boxH - 10);

        if (hasTitle) {
          ctx.fillStyle = '#fbd000';
          ctx.font = '7px "Press Start 2P", monospace';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'top';
          ctx.fillText(data.title, boxX + 13, boxY + 11);
        }

        ctx.fillStyle = '#ffffff';
        ctx.font = '7px "Press Start 2P", monospace';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        const visWords = visibleText.split(' ');
        let line = '';
        let lineY = boxY + headerOffset;

        for (let i = 0; i < visWords.length; i++) {
          const testLine = line + visWords[i] + ' ';
          if (ctx.measureText(testLine).width > maxTextWidth && i > 0) {
            ctx.fillText(line.trim(), boxX + 13, lineY);
            line = visWords[i] + ' ';
            lineY += lineHeight;
          } else {
            line = testLine;
          }
        }
        ctx.fillText(line.trim(), boxX + 13, lineY);

        const isDone = state.typedChars >= data.text.length;
        const blink = Math.floor(state.frame / 22) % 2 === 0;
        ctx.fillStyle = isDone ? (blink ? '#43c43b' : '#ffffff') : '#b0b8d1';
        ctx.font = '6px "Press Start 2P", monospace';
        ctx.textAlign = 'right';
        ctx.fillText(
          isDone ? '[ESPAÇO / OK] CONTINUAR ▶' : '[ESPAÇO / OK] COMPLETAR',
          boxX + boxW - 13,
          boxY + boxH - 13
        );
      }

      function drawStageClearBanner() {
        if (!state.stageCompleted) return;

        const stage = state.currentStage;
        const bw = 392;
        const bh = stage === 3 ? 116 : 98;
        const bx = (VIEW_W - bw) / 2;
        const by = 28;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.72)';
        ctx.fillRect(bx + 4, by + 4, bw, bh);

        ctx.fillStyle = '#0c1c44';
        ctx.fillRect(bx, by, bw, bh);

        ctx.strokeStyle = '#fbd000';
        ctx.lineWidth = 3;
        ctx.strokeRect(bx + 2, by + 2, bw - 4, bh - 4);

        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        const blink = Math.floor(state.frame / 22) % 2 === 0;

        if (stage === 1) {
          ctx.fillStyle = '#fbd000';
          ctx.font = '11px "Press Start 2P", monospace';
          ctx.fillText('FASE 1 CONCLUÍDA!', VIEW_W / 2, by + 14);

          ctx.fillStyle = '#ffffff';
          ctx.font = '7px "Press Start 2P", monospace';
          ctx.fillText('FORMAÇÃO & COMEÇO DE CARREIRA (SP)', VIEW_W / 2, by + 36);

          ctx.fillStyle = blink ? '#43c43b' : '#a8f0a4';
          ctx.fillText('[ESPAÇO / OK] IR PARA FASE 2 ▶', VIEW_W / 2, by + 64);
        } else if (stage === 2) {
          ctx.fillStyle = '#fbd000';
          ctx.font = '11px "Press Start 2P", monospace';
          ctx.fillText('FASE 2 CONCLUÍDA!', VIEW_W / 2, by + 14);

          ctx.fillStyle = '#ffffff';
          ctx.font = '7px "Press Start 2P", monospace';
          ctx.fillText('EMBARQUE PARA LISBOA • PORTUGAL', VIEW_W / 2, by + 36);

          ctx.fillStyle = blink ? '#43c43b' : '#a8f0a4';
          ctx.fillText('[ESPAÇO / OK] IR PARA FASE 3 ▶', VIEW_W / 2, by + 64);
        } else {
          ctx.fillStyle = '#fbd000';
          ctx.font = '10.5px "Press Start 2P", monospace';
          ctx.fillText('CURRÍCULO 8-BIT CONCLUÍDO!', VIEW_W / 2, by + 14);

          ctx.fillStyle = '#ffffff';
          ctx.font = '7px "Press Start 2P", monospace';
          ctx.fillText('VITOR MORTARA • LISBOA, PORTUGAL', VIEW_W / 2, by + 36);

          ctx.fillStyle = '#a8c6fa';
          ctx.font = '6.5px "Press Start 2P", monospace';
          ctx.fillText('vitor.mortara@gmail.com • +351 916 644 788', VIEW_W / 2, by + 56);

          ctx.fillStyle = blink ? '#43c43b' : '#a8f0a4';
          ctx.font = '7px "Press Start 2P", monospace';
          ctx.fillText('[ESPAÇO / OK] JOGAR NOVAMENTE ↺', VIEW_W / 2, by + 84);
        }
      }

      function render() {
        const stage = state.currentStage;

        ctx.fillStyle = '#5C94FC';
        ctx.fillRect(0, 0, VIEW_W, VIEW_H);

        clouds.forEach((c) => {
          const screenX = Math.round(c.x - state.cameraX * 0.35);
          if (screenX > -80 && screenX < VIEW_W + 80) {
            drawCloud(screenX, c.y, c.size);
          }
        });

        if (stage === 1) {
          drawSPBuildings(spBuildingsS1, state.cameraX, -100);
          s1Trees.forEach((item) => {
            const screenX = Math.round(item.x - state.cameraX);
            if (screenX > -60 && screenX < VIEW_W + 60) {
              drawS1Foliage(item, screenX);
            }
          });
        } else if (stage === 2) {
          drawSPBuildings(spBuildingsS2, state.cameraX, 0);
        } else {
          drawLisbonBuildings(state.cameraX);
        }

        drawGround(state.cameraX);

        if (stage === 1) {
          drawS1FFLCH(state.cameraX);
          drawS1WritingDesk(state.cameraX);
          drawFinishFlag(S1.FINISH_FLAG_X, state.cameraX, 1);
        } else if (stage === 2) {
          drawS2CoffeeCounter(state.cameraX);
          drawS2CargoBike(state.cameraX);
          drawS2ProduceMarket(state.cameraX);
          drawS2AirportAndPlane(state.cameraX);
        } else {
          drawS3Restaurant(state.cameraX);
          drawS3PastaStation(state.cameraX);
          drawS3StainlessKitchen(state.cameraX);
          drawS3ComputerDesk(state.cameraX);
          drawFinishFlag(S3.FINISH_FLAG_X, state.cameraX, 3);
        }

        drawPlayer(state.cameraX);

        if (state.player.x < 130 && !state.activeDialogueKey && !state.stageCompleted) {
          ctx.fillStyle = '#ffffff';
          ctx.font = '8px "Press Start 2P", monospace';
          ctx.textAlign = 'left';
          ctx.fillText('SIGA PARA A DIREITA →', 20, 22);
        }

        drawDialogueBox();
        drawStageClearBanner();
      }

      function gameLoop() {
        update();
        render();
        requestAnimationFrame(gameLoop);
      }

      window.onload = function () {
        loadStage(1);
        gameLoop();
      };
    })();
  </script>
</body>
